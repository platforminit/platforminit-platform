alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.platform.receiver]
      }

      loki.process "platform" {
        stage.static_labels {
          values = {
            cluster = "platforminit-single-node",
            environment = "homelab",
          }
        }

        stage.label_keep {
          values = [
            "namespace",
            "pod",
            "container",
            "app",
            "component",
            "cluster",
            "environment",
          ]
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
