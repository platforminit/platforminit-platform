apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platforminit-observability-baseline
  namespace: observability
  labels:
    app.kubernetes.io/part-of: platforminit
    platforminit.io/chapter: ch05
spec:
  groups:
    - name: platforminit.host
      rules:
        - alert: HostCPUHigh
          expr: avg by (instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m])) > 0.85
          for: 10m
          labels:
            severity: warning
            layer: host
          annotations:
            summary: Host CPU usage is high
            description: CPU usage has exceeded 85% for 10 minutes.
        - alert: HostMemoryPressure
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
          for: 10m
          labels:
            severity: warning
            layer: host
          annotations:
            summary: Host memory pressure detected
            description: Available memory dropped below 15% for 10 minutes.
        - alert: HostDiskPressure
          expr: (node_filesystem_avail_bytes{mountpoint="/srv",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/srv",fstype!="tmpfs"}) < 0.15
          for: 15m
          labels:
            severity: critical
            layer: host
          annotations:
            summary: /srv free space is low
            description: /srv free space dropped below 15% for 15 minutes.
    - name: platforminit.kubernetes
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            layer: kubernetes
          annotations:
            summary: Kubernetes node is not ready
            description: Node has been not ready for more than 5 minutes.
        - alert: PodCrashLooping
          expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m])) > 3
          for: 5m
          labels:
            severity: warning
            layer: kubernetes
          annotations:
            summary: Pod restart loop detected
            description: A container restarted more than 3 times in 10 minutes.
        - alert: PodNotReady
          expr: max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 10m
          labels:
            severity: warning
            layer: kubernetes
          annotations:
            summary: Pod is not healthy
            description: Pod is stuck in Pending, Unknown, or Failed state.
    - name: platforminit.platform
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: max by (name) (argocd_app_info{sync_status!="Synced"}) > 0
          for: 15m
          labels:
            severity: warning
            layer: platform
          annotations:
            summary: Argo CD application is out of sync
            description: At least one Argo CD application has remained out of sync for 15 minutes.
        - alert: CertExpirySoon
          expr: min by (name, exported_namespace) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400) < 14
          for: 30m
          labels:
            severity: warning
            layer: platform
          annotations:
            summary: Certificate expires soon
            description: Certificate will expire within 14 days.
        - alert: LokiDown
          expr: up{job=~".*loki.*"} == 0
          for: 10m
          labels:
            severity: critical
            layer: observability
          annotations:
            summary: Loki target is down
            description: Loki metrics endpoint is unavailable.
        - alert: VictoriaMetricsDown
          expr: up{job=~".*vm.*|.*victoria.*"} == 0
          for: 10m
          labels:
            severity: critical
            layer: observability
          annotations:
            summary: VictoriaMetrics target is down
            description: VictoriaMetrics metrics endpoint is unavailable.
