apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-rules
  namespace: observability
spec:
  groups:
    - name: platform.rules
      interval: 30s
      rules:
        - alert: NodeCPUHigh
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node CPU usage is high
            description: Instance {{ $labels.instance }} CPU usage exceeded 85% for 10m.
        - alert: NodeMemoryPressure
          expr: (1 - ((node_memory_MemAvailable_bytes or node_memory_MemFree_bytes) / node_memory_MemTotal_bytes)) * 100 > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node memory usage is high
            description: Instance {{ $labels.instance }} memory usage exceeded 90% for 10m.
        - alert: NodeFilesystemSpaceLow
          expr: (node_filesystem_avail_bytes{fstype!=""} / node_filesystem_size_bytes{fstype!=""}) * 100 < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node filesystem space is low
            description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free space.
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Pod is restarting repeatedly
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15m.
        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="true"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod is not ready
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has not been ready for 15m.
        - alert: LokiDown
          expr: up{job=~".*loki.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Loki target is down
            description: Loki scrape target has been down for 10m.
        - alert: VictoriaMetricsDown
          expr: up{job=~".*victoria.*|.*vm.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: VictoriaMetrics target is down
            description: VictoriaMetrics scrape target has been down for 10m.
