apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-rules
  namespace: observability
  labels:
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: alerting
    platforminit.io/chapter: ch05
spec:
  groups:
    - name: platforminit.host.rules
      interval: 30s
      rules:
        - alert: HostNodeExporterDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 5m
          labels:
            severity: critical
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: node-exporter
            owner: platform
          annotations:
            summary: "Host telemetry is down"
            impact: "Host CPU, memory, filesystem and network visibility may be unavailable."
            action: "Check the node-exporter pod and the platform-node-exporter VMServiceScrape."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: HostCPUHighWarning
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 15m
          labels:
            severity: warning
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: host
            owner: platform
          annotations:
            summary: "Host CPU usage is high"
            impact: "Workloads may become slow if CPU saturation continues."
            action: "Open PlatformInit / 10 - Host Infrastructure and check top workload usage."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: HostMemoryPressureWarning
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
          for: 15m
          labels:
            severity: warning
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: host
            owner: platform
          annotations:
            summary: "Host memory pressure is high"
            impact: "The node may start evicting pods or swapping if memory pressure increases."
            action: "Check Kubernetes memory usage and large pods in the k3s dashboard."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: HostFilesystemSpaceLowWarning
          expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"})) > 80
          for: 15m
          labels:
            severity: warning
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: filesystem
            owner: platform
          annotations:
            summary: "Filesystem usage is above warning threshold"
            impact: "The host may run out of space if growth continues."
            action: "Check mount {{ $labels.mountpoint }} on {{ $labels.instance }} and review log/storage growth."
            runbook_url: "docs/multi-project-host-discovery-and-volume-layout.md"
        - alert: HostFilesystemSpaceLowCritical
          expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"})) > 90
          for: 10m
          labels:
            severity: critical
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: filesystem
            owner: platform
          annotations:
            summary: "Filesystem usage is critical"
            impact: "The platform may become unstable or fail writes on {{ $labels.mountpoint }}."
            action: "Free disk space or expand the affected volume before continuing deployments."
            runbook_url: "docs/multi-project-host-discovery-and-volume-layout.md"
        - alert: HostFilesystemInodesLowWarning
          expr: 100 * (1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|aufs|nsfs",mountpoint=~"/|/srv.*"})) > 80
          for: 15m
          labels:
            severity: warning
            category: host
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: filesystem
            owner: platform
          annotations:
            summary: "Filesystem inode usage is high"
            impact: "The host may fail to create files even when disk space remains."
            action: "Check inode-heavy paths under {{ $labels.mountpoint }}."
            runbook_url: "docs/multi-project-host-discovery-and-volume-layout.md"
    - name: platforminit.cluster.rules
      interval: 30s
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            category: cluster
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: k3s
            owner: platform
          annotations:
            summary: "Kubernetes node is not Ready"
            impact: "The single-node k3s cluster cannot reliably run workloads."
            action: "Check k3s service health and node conditions."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: KubernetesPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 10m
          labels:
            severity: critical
            category: cluster
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: workload
            owner: platform
          annotations:
            summary: "Pod is restarting repeatedly"
            impact: "A workload is unstable and may be unavailable."
            action: "Check pod logs for {{ $labels.namespace }}/{{ $labels.pod }}."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: KubernetesPodPendingOrFailed
          expr: kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} > 0
          for: 10m
          labels:
            severity: warning
            category: cluster
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: workload
            owner: platform
          annotations:
            summary: "Pod is Pending, Failed or Unknown"
            impact: "A workload may not be scheduled or may have failed."
            action: "Check pod events and scheduling details for {{ $labels.namespace }}/{{ $labels.pod }}."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: KubernetesDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable > 0
          for: 10m
          labels:
            severity: warning
            category: cluster
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: deployment
            owner: platform
          annotations:
            summary: "Deployment has unavailable replicas"
            impact: "A deployment may be degraded or partially unavailable."
            action: "Check rollout status for {{ $labels.namespace }}/{{ $labels.deployment }}."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
        - alert: PersistentVolumeClaimFillingUp
          expr: 100 * (1 - (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes)) > 80
          for: 15m
          labels:
            severity: warning
            category: cluster
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: pvc
            owner: platform
          annotations:
            summary: "PVC usage is high"
            impact: "A Kubernetes persistent volume may run out of space."
            action: "Check PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} and workload retention."
            runbook_url: "platform/observability/docs/ch05-k3s-monitoring-runbook.md"
    - name: platforminit.platform.rules
      interval: 30s
      rules:
        - alert: ArgoCDDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="argocd"} > 0
          for: 10m
          labels:
            severity: critical
            category: platform
            project: development
            environment: dev
            lifecycle_ch: ch04
            service: argocd
            owner: platform
          annotations:
            summary: "Argo CD component is unavailable"
            impact: "GitOps reconciliation may be degraded or unavailable."
            action: "Check Argo CD component health and pod logs."
            runbook_url: "docs/identity-layer-refactor.md"
        - alert: ArgoCDApplicationOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} > 0
          for: 10m
          labels:
            severity: warning
            category: platform
            project: development
            environment: dev
            lifecycle_ch: ch04
            service: argocd
            owner: platform
          annotations:
            summary: "Argo CD application is out of sync"
            impact: "Git desired state differs from cluster state."
            action: "Open Argo CD and inspect application {{ $labels.name }}."
            runbook_url: "docs/identity-layer-refactor.md"
        - alert: IdentityDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="identity"} > 0
          for: 10m
          labels:
            severity: critical
            category: identity
            project: development
            environment: dev
            lifecycle_ch: ch04.5
            service: authentik
            owner: platform
          annotations:
            summary: "Identity component is unavailable"
            impact: "SSO login through Authentik may be unavailable."
            action: "Check Authentik server and worker rollout status."
            runbook_url: "platform/identity/docs/ch04-5-identity-foundation-runbook.md"
    - name: platforminit.observability.rules
      interval: 30s
      rules:
        - alert: ObservabilityGrafanaUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="observability",deployment=~".*grafana.*"} > 0
          for: 10m
          labels:
            severity: critical
            category: observability
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: grafana
            owner: platform
          annotations:
            summary: "Grafana is unavailable"
            impact: "The operator console may be unavailable."
            action: "Check Grafana deployment rollout and pod logs."
            runbook_url: "docs/ch05-operational-observability-design.md"
        - alert: ObservabilityVMAgentUnavailable
          expr: absent(up{job=~".*vmagent.*"}) or up{job=~".*vmagent.*"} == 0
          for: 10m
          labels:
            severity: critical
            category: observability
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: vmagent
            owner: platform
          annotations:
            summary: "VMAgent scrape pipeline is unavailable"
            impact: "Metrics collection may be stopped or incomplete."
            action: "Check VMAgent pod and additional scrape Secret."
            runbook_url: "docs/ch05-operational-observability-design.md"
        - alert: ObservabilityVictoriaMetricsUnavailable
          expr: absent(up{job=~".*(vmsingle|victoria).*"}) or up{job=~".*(vmsingle|victoria).*"} == 0
          for: 10m
          labels:
            severity: critical
            category: observability
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: victoriametrics
            owner: platform
          annotations:
            summary: "VictoriaMetrics is unavailable"
            impact: "Metrics storage/query may be unavailable."
            action: "Check VMSingle health and storage."
            runbook_url: "docs/ch05-operational-observability-design.md"
        - alert: ObservabilityLokiUnavailable
          expr: absent(up{job=~".*loki.*"}) or up{job=~".*loki.*"} == 0
          for: 10m
          labels:
            severity: warning
            category: observability
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: loki
            owner: platform
          annotations:
            summary: "Loki log backend is unavailable"
            impact: "Grafana log search and log panels may not work."
            action: "Check Loki pod and service status."
            runbook_url: "docs/ch05-operational-observability-design.md"
        - alert: ObservabilityAlertmanagerUnavailable
          expr: absent(up{job=~".*alertmanager.*"}) or up{job=~".*alertmanager.*"} == 0
          for: 10m
          labels:
            severity: warning
            category: observability
            project: development
            environment: dev
            lifecycle_ch: ch05
            service: alertmanager
            owner: platform
          annotations:
            summary: "Alertmanager is unavailable"
            impact: "Alert grouping and routing may not work."
            action: "Check Alertmanager pod/service status."
            runbook_url: "platform/observability/alerts/README.md"
