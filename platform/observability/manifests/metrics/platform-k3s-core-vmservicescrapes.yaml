apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: platform-kube-state-metrics
  namespace: observability
  labels:
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: platform-node-exporter
  namespace: observability
  labels:
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
