# PlatformInit CH05 k3s-safe supplemental scrape jobs.
#
# The victoria-metrics-k8s-stack chart ships generic Kubernetes dashboards and
# VMServiceScrape objects. On k3s, some control-plane endpoints differ from a
# kubeadm-style cluster, so CH05 adds explicit supplemental jobs for the metrics
# that must exist in a single-node homelab baseline:
# - Kubernetes API server via the default/kubernetes service
# - kubelet and cAdvisor via the Kubernetes API node proxy
# - kube-state-metrics by endpoint discovery
# - node-exporter by endpoint discovery

- job_name: platform-k3s-apiserver
  kubernetes_sd_configs:
    - role: endpoints
  scheme: https
  tls_config:
    insecure_skip_verify: true
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabel_configs:
    - source_labels:
        - __meta_kubernetes_namespace
        - __meta_kubernetes_service_name
        - __meta_kubernetes_endpoint_port_name
      action: keep
      regex: default;kubernetes;https
    - target_label: component
      replacement: apiserver
    - target_label: job
      replacement: platform-k3s-apiserver

- job_name: platform-k3s-kubelet
  kubernetes_sd_configs:
    - role: node
  scheme: https
  tls_config:
    insecure_skip_verify: true
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  metrics_path: /metrics
  relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      target_label: __metrics_path__
      replacement: /api/v1/nodes/$1/proxy/metrics
    - source_labels: [__meta_kubernetes_node_name]
      target_label: node
    - target_label: job
      replacement: platform-k3s-kubelet

- job_name: platform-k3s-cadvisor
  kubernetes_sd_configs:
    - role: node
  scheme: https
  tls_config:
    insecure_skip_verify: true
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  metrics_path: /metrics/cadvisor
  relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      target_label: __metrics_path__
      replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    - source_labels: [__meta_kubernetes_node_name]
      target_label: node
    - target_label: job
      replacement: platform-k3s-cadvisor

- job_name: platform-kube-state-metrics
  kubernetes_sd_configs:
    - role: endpoints
  relabel_configs:
    - source_labels:
        - __meta_kubernetes_namespace
        - __meta_kubernetes_service_name
        - __meta_kubernetes_endpoint_port_number
      action: keep
      regex: observability;.*kube-state-metrics.*;8080
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_service_name]
      target_label: service
    - target_label: job
      replacement: platform-kube-state-metrics

- job_name: platform-node-exporter
  kubernetes_sd_configs:
    - role: endpoints
  relabel_configs:
    - source_labels:
        - __meta_kubernetes_namespace
        - __meta_kubernetes_service_name
        - __meta_kubernetes_endpoint_port_number
      action: keep
      regex: observability;.*node-exporter.*;9100
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_node_name]
      target_label: node
    - source_labels: [__meta_kubernetes_service_name]
      target_label: service
    - target_label: job
      replacement: platform-node-exporter

- job_name: platform-annotated-pods
  kubernetes_sd_configs:
    - role: pod
  relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: "true"
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
    - target_label: job
      replacement: platform-annotated-pods
