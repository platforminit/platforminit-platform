apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-node-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
data:
  platform-node-overview.json: |
    {
      "uid": "platform-node-overview",
      "title": "PlatformInit / Node Overview",
      "tags": ["platforminit", "node", "k3s"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "VictoriaMetrics", "value": "VictoriaMetrics" }
          },
          {
            "name": "node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Scrape targets up",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "sum(up)", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Kubernetes nodes",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "count(kube_node_info)", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Node exporter targets",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "count(up{job=\"platform-node-exporter\"} == 1)", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "cAdvisor targets",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "count(up{job=\"platform-k3s-cadvisor\"} == 1)", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "CPU busy %",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\"$node\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Memory used %",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"}))", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Filesystem used %",
          "gridPos": { "x": 0, "y": 13, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "100 * (1 - (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\", instance=~\"$node\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\", instance=~\"$node\"}))", "legendFormat": "{{instance}} {{mountpoint}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Container CPU usage",
          "gridPos": { "x": 12, "y": 13, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [ { "expr": "sum by(namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))", "legendFormat": "{{namespace}}", "refId": "A" } ]
        }
      ]
    }
