apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-40-identity-sso
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
    platforminit.io/dashboard-tier: operational
    platforminit.io/dashboard-role: identity
data:
  40-identity-sso.json: |
    {
      "uid": "identity-sso",
      "title": "PlatformInit / 40 - Identity / SSO",
      "description": "",
      "tags": [
        "platforminit",
        "ch05",
        "operational",
        "identity",
        "sso"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          },
          {
            "name": "loki_datasource",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "loki"
            }
          },
          {
            "name": "project",
            "type": "custom",
            "query": "development,n8n,platforminit",
            "current": {
              "text": "development",
              "value": "development"
            }
          },
          {
            "name": "environment",
            "type": "custom",
            "query": "dev,staging,prod",
            "current": {
              "text": "dev",
              "value": "dev"
            }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(kube_namespace_created, namespace)",
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Operator intent",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "This dashboard answers: **is Authentik and SSO healthy?** First implementation uses Kubernetes health and Loki log signals. Native Authentik metrics can be added later."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Identity pods not ready",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"identity\",condition=\"false\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Authentik server replicas",
          "description": "",
          "gridPos": {
            "x": 4,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"identity\",deployment=~\".*authentik.*server.*\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Authentik worker replicas",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"identity\",deployment=~\".*authentik.*worker.*\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Identity restarts",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"identity\"}[30m])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Provider/login log errors",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"identity\"} |~ \"(?i)(failed|error|invalid|callback|oauth|oidc|provider)\" [15m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Auth endpoint scrape down",
          "description": "",
          "gridPos": {
            "x": 20,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"identity\"} == 0) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Identity workload readiness",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"identity\"}",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": ""
            }
          }
        },
        {
          "id": 9,
          "type": "logs",
          "title": "Authentik login/provider errors",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "targets": [
            {
              "expr": "{namespace=\"identity\"} |~ \"(?i)(failed|error|invalid|callback|oauth|oidc|provider|denied)\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Recent identity logs",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "targets": [
            {
              "expr": "{namespace=\"identity\"} |= \"\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ]
    }
