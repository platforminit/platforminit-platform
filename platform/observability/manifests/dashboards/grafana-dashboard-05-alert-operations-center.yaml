apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-05-alert-operations-center
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
    platforminit.io/dashboard-tier: operational
    platforminit.io/dashboard-role: alert-operations
    platforminit.io/lifecycle-ch: ch05
data:
