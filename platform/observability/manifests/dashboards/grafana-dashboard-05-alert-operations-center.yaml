apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-05-alert-operations-center
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platforminit
    app.kubernetes.io/component: observability
    platforminit.io/dashboard-tier: operational
    platforminit.io/dashboard-role: alert-operations
    platforminit.io/lifecycle-ch: ch05
data:
  platform-alert-operations-center.json: |
    {
      "uid": "platform-alert-operations-center",
      "title": "PlatformInit / 05 - Alert Operations Center",
      "tags": [
        "platforminit",
        "ch05",
        "alerts",
        "alertmanager",
        "operational",
        "nagios-style"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to use this dashboard",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "### Alert Operations Center\nThis dashboard is the Nagios-style operational alert view for PlatformInit. Start here when the platform is unhealthy: check CRITICAL first, then WARNING, then UNKNOWN. Only actionable alerts should appear here; noisy engineering panels belong in deeper troubleshooting dashboards."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CRITICAL alerts firing",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
