    {
      "uid": "platform-alert-operations-center",
      "title": "PlatformInit / 05 - Alert Operations Center",
      "tags": [
        "platforminit",
        "ch05",
        "alerts",
        "alertmanager",
        "operational",
        "nagios-style"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to use this dashboard",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "### Alert Operations Center\nNagios-style operating view for PlatformInit. This page must answer: **what is broken, where, how severe, and what should I do next?**\n\nTriage order: **CRITICAL \u2192 UNKNOWN \u2192 WARNING**. If this page only shows numbers, the alert contract is broken; every alert must carry layer, service, target and next-action labels."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CRITICAL - fix now",
          "description": "Service-impacting or unsafe state. Immediate action.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
