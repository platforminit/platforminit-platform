apiVersion: v1
kind: Secret
metadata:
  name: zabbix-postgres
  namespace: operations
type: Opaque
stringData:
  POSTGRES_DB: zabbix
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: changeme-zabbix-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zabbix-postgres-data
  namespace: operations
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-postgres
  namespace: operations
  labels:
    app.kubernetes.io/name: zabbix-postgres
    app.kubernetes.io/part-of: platforminit-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: zabbix-postgres
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zabbix-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-postgres
  namespace: operations
spec:
  selector:
    app.kubernetes.io/name: zabbix-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
