# Environment-specific values are injected by the CH05 Argo CD Application.
# Do not hardcode customer/dev domains in templates.
baseDomain: ""
tlsIssuer: letsencrypt-prod

# CH05 storage contract.
# Observability-owned persistent data must live outside the generic k3s/local-path PVC tree.
# This keeps k3s runtime data (/srv/data/k3s) separate from operations stack data.
observabilityStorageRoot: /srv/observability/data
zabbixPostgresStorageSize: 5Gi
openobserveStorageSize: 10Gi
