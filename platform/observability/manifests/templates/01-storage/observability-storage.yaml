{{- $root := default "/srv/observability/data" .Values.observabilityStorageRoot -}}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: platforminit-zabbix-postgres-data
  labels:
    app.kubernetes.io/name: zabbix-postgres
    app.kubernetes.io/part-of: platforminit-operations
    platforminit.io/storage-scope: observability
spec:
  capacity:
    storage: {{ default "5Gi" .Values.zabbixPostgresStorageSize | quote }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ printf "%s/zabbix-postgres" $root | quote }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: platforminit-openobserve-data
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/part-of: platforminit-operations
    platforminit.io/storage-scope: observability
spec:
  capacity:
    storage: {{ default "10Gi" .Values.openobserveStorageSize | quote }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ printf "%s/openobserve" $root | quote }}
    type: DirectoryOrCreate
