apiVersion: v1
kind: Secret
metadata:
  name: openobserve-root
  namespace: operations
type: Opaque
stringData:
  ZO_ROOT_USER_EMAIL: admin@sysadminhomelab.hu
  ZO_ROOT_USER_PASSWORD: changeme-openobserve-root
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve-data
  namespace: operations
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: operations
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/part-of: platforminit-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: openobserve-root
          env:
            - name: ZO_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 5080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openobserve-data
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: operations
spec:
  selector:
    app.kubernetes.io/name: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: http
