name: 02.5 - File Integrity Check

on:
  workflow_dispatch:
    inputs:
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''
  schedule:
    - cron: '32 3 * * 3'

permissions:
  contents: read
  actions: read

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    with:
      server_id_override: ${{ inputs.server_id_override }}
      target_user: ${{ secrets.HOST_LOGIN_USER }}
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '15'
      mode: fim-check
    secrets: inherit

  run:
    needs: grant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_api_token: ${{ secrets.INFRA_API_TOKEN }}
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload scripts and policy
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "mkdir -p /tmp/platforminit-run"
          scp -i ~/.ssh/id_ed25519 platform/host-baseline/scripts/fim-check.sh "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/fim-check.sh"
          scp -i ~/.ssh/id_ed25519 platform/host-baseline/scripts/lib-policy.sh "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/lib-policy.sh"
          scp -i ~/.ssh/id_ed25519 platform/host-baseline/policy/baseline.yaml "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/baseline.yaml"

      - name: Execute scoped command
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "chmod +x /tmp/platforminit-run/fim-check.sh && sudo -n /tmp/platforminit-run/fim-check.sh /tmp/platforminit-fim-check.txt"

      - name: Fetch report
        if: always()
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/fim
          scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-fim-check.txt" artifacts/fim/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fim-check-${{ github.run_id }}
          path: artifacts/fim
          if-no-files-found: ignore

