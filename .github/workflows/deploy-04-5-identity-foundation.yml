name: 04.5 - Bootstrap Identity Foundation

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Producing build workflow run ID
        required: true
        type: string
      artifact_id:
        description: Identity artifact ID
        required: true
        type: string
      project:
        description: PlatformInit project label / logical environment
        required: false
        default: development
      host_name:
        description: Logical host name within the project
        required: false
        default: platforminit-dev-01
      role:
        description: Target host role used for label discovery when host_name is empty
        required: false
        default: primary
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''
      authentik_bootstrap_admin_username:
        description: Existing Authentik bootstrap admin username to place into foundation groups
        required: true
        default: akadmin
        type: string

permissions:
  contents: read
  actions: read

env:
  HCLOUD_TOKEN_DEVELOPMENT: ${{ secrets.HCLOUD_TOKEN_DEVELOPMENT }}
  HCLOUD_TOKEN_N8N: ${{ secrets.HCLOUD_TOKEN_N8N }}
  HCLOUD_TOKEN_PLATFORMINIT: ${{ secrets.HCLOUD_TOKEN_PLATFORMINIT }}

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    secrets: inherit
    with:
      project: ${{ inputs.project || 'development' }}
      host_name: ${{ inputs.host_name || 'platforminit-dev-01' }}
      role: ${{ inputs.role || 'primary' }}
      server_id_override: ${{ inputs.server_id_override }}
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '15'
      mode: identity-foundation

  deploy:
    needs: grant
    runs-on: ubuntu-latest
    environment: ${{ inputs.project || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          project: ${{ inputs.project || 'development' }}
          host_name: ${{ inputs.host_name || 'platforminit-dev-01' }}
          role: ${{ inputs.role || 'primary' }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Download identity artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ./downloaded-artifacts

      - name: Resolve archive
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find ./downloaded-artifacts -type f -name 'platforminit-identity-*.tar.gz' | sort | head -n1)"
          [ -n "$archive_path" ] || { find ./downloaded-artifacts -type f | sort >&2; exit 1; }
          filename="$(basename "$archive_path")"
          short_sha="${filename#platforminit-identity-}"
          short_sha="${short_sha%.tar.gz}"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote identity foundation script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ch04-5-remote.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          usage() {
            echo "Usage: $0 run SHORT_SHA PLATFORM_BASE_DOMAIN AUTHENTIK_BOOTSTRAP_ADMIN_USERNAME OWNER_USER" >&2
            exit 2
          }

          [[ $# -ge 5 ]] || usage

          ACTION="$1"
          SHORT_SHA="$2"
          PLATFORM_BASE_DOMAIN="$3"
          AUTHENTIK_BOOTSTRAP_ADMIN_USERNAME="$4"
          OWNER_USER="$5"

          [[ "$ACTION" == "run" ]] || usage
          [[ "${EUID}" -eq 0 ]] || { echo "ch04-5-remote.sh must run as root" >&2; exit 1; }

          if [[ -f /etc/platforminit/host-context.env ]]; then
            # shellcheck disable=SC1091
            source /etc/platforminit/host-context.env
          fi

          PLATFORMINIT_IDENTITY_PATH="${PLATFORMINIT_IDENTITY_PATH:-/srv/identity}"
          release_root="${PLATFORMINIT_IDENTITY_PATH}/platforminit"
          release_dir="${release_root}/${SHORT_SHA}"
          tmp_root="/tmp/platforminit-identity-foundation"
          tmp_dir="${tmp_root}/${SHORT_SHA}"
          unpack_dir="${tmp_dir}/unpacked"
          report_dir="${release_root}/reports"
          bootstrap_log="${tmp_dir}/ch04-5-bootstrap-${SHORT_SHA}.log"
          validate_log="${tmp_dir}/ch04-5-validate-${SHORT_SHA}.log"
          report_bootstrap="${report_dir}/ch04-5-bootstrap-${SHORT_SHA}.log"
          report_validate="${report_dir}/ch04-5-validate-${SHORT_SHA}.log"

          ensure_owner_access() {
            mkdir -p "$tmp_dir" "$report_dir"
            chown "${OWNER_USER}:${OWNER_USER}" "$tmp_dir" 2>/dev/null || true
            chmod 755 "$tmp_dir" 2>/dev/null || true
            for f in "$bootstrap_log" "$validate_log"; do
              if [[ -e "$f" ]]; then
                chown "${OWNER_USER}:${OWNER_USER}" "$f" 2>/dev/null || true
                chmod 644 "$f" 2>/dev/null || true
              fi
            done
          }

          cleanup_old_logs() {
            find "$tmp_root" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          }

          main() {
            mkdir -p "$release_dir" "$unpack_dir" "$report_dir" "$tmp_dir"
            cleanup_old_logs
            rm -rf "${release_dir:?}/"* "${unpack_dir:?}/"*
            rm -f "$bootstrap_log" "$validate_log"

            tar -xzf "${tmp_dir}/identity-release.tar.gz" -C "$unpack_dir"
            test -d "$unpack_dir/platform/identity" || {
              echo "Missing platform/identity in artifact" >&2
              find "$unpack_dir" -maxdepth 4 -print >&2
              exit 1
            }

            rsync -a --delete "$unpack_dir/platform/identity/" "$release_dir/"
            find "$release_dir" -type f -name "*.sh" -exec chmod +x {} \;

            export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
            export BASE_DOMAIN="$PLATFORM_BASE_DOMAIN"
            export AUTHENTIK_BOOTSTRAP_ADMIN_USERNAME

            test -f "$KUBECONFIG" || { echo "Missing kubeconfig at $KUBECONFIG" >&2; exit 1; }
            test -x "$release_dir/scripts/ch04-5-bootstrap-identity-model.sh" || { echo "Missing CH04.5 bootstrap script" >&2; exit 1; }
            test -x "$release_dir/validate/ch04-5-validate-identity-model.sh" || { echo "Missing CH04.5 validation script" >&2; exit 1; }

            "$release_dir/scripts/ch04-5-bootstrap-identity-model.sh" | tee "$bootstrap_log"
            "$release_dir/validate/ch04-5-validate-identity-model.sh" | tee "$validate_log"

            cp "$bootstrap_log" "$report_bootstrap" || true
            cp "$validate_log" "$report_validate" || true
            ensure_owner_access
          }

          trap 'ensure_owner_access' EXIT
          main "$@"
          EOS
          chmod +x /tmp/ch04-5-remote.sh

      - name: Upload and run identity foundation bootstrap
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
          ARCHIVE: ${{ steps.artifact.outputs.archive_path }}
          PLATFORM_BASE_DOMAIN: ${{ secrets.PLATFORM_BASE_DOMAIN }}
          AUTHENTIK_BOOTSTRAP_ADMIN_USERNAME: ${{ inputs.authentik_bootstrap_admin_username }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PLATFORM_BASE_DOMAIN:?Missing PLATFORM_BASE_DOMAIN secret}"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "mkdir -p /tmp/platforminit-identity-foundation/${SHORTSHA} /tmp/platforminit-run"
          scp -i ~/.ssh/id_ed25519 "$ARCHIVE" "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-identity-foundation/${SHORTSHA}/identity-release.tar.gz"
          scp -i ~/.ssh/id_ed25519 /tmp/ch04-5-remote.sh "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/ch04-5-remote.sh"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "
            set -euo pipefail
            chmod +x /tmp/platforminit-run/ch04-5-remote.sh
            sudo -n /tmp/platforminit-run/ch04-5-remote.sh run '${SHORTSHA}' '${PLATFORM_BASE_DOMAIN}' '${AUTHENTIK_BOOTSTRAP_ADMIN_USERNAME}' '${HOST_LOGIN_USER}'
          "

      - name: Fetch validation report
        if: always()
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./identity-foundation-reports
          remote_tmp_dir="/tmp/platforminit-identity-foundation/${SHORTSHA}"

          for file in "ch04-5-bootstrap-${SHORTSHA}.log" "ch04-5-validate-${SHORTSHA}.log"; do
            if ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "test -f '${remote_tmp_dir}/${file}'"; then
              scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:${remote_tmp_dir}/${file}" "./identity-foundation-reports/${file}"
            else
              echo "No report found: ${file}"
            fi
          done

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch04-5-identity-foundation-validate-${{ steps.artifact.outputs.short_sha }}
          path: ./identity-foundation-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Print deploy metadata
        if: always()
        shell: bash
        run: |
          {
            echo "CH04.5 identity foundation run completed"
            echo "artifact_run_id=${{ inputs.artifact_run_id }}"
            echo "artifact_id=${{ inputs.artifact_id }}"
            echo "short_sha=${{ steps.artifact.outputs.short_sha }}"
            echo "host_public_ip=${{ steps.server.outputs.public_ip }}"
            echo "public_url=https://auth.${{ secrets.PLATFORM_BASE_DOMAIN }}"
          }
