name: 05 - Deploy Observability Stack

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Execute deploy
        run: |
          set -euo pipefail

          HOST="${{ secrets.HOST_PUBLIC_IP }}"
          USER="devops"

          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "
            set -euo pipefail
            chmod +x /tmp/ch05-orchestrator.sh || true
            sudo -n /tmp/ch05-orchestrator.sh
          "
