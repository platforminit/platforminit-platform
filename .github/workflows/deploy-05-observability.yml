name: 05 - Deploy Observability Stack

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Producing build workflow run ID
        required: true
        type: string
      artifact_id:
        description: Observability artifact ID
        required: true
        type: string
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''
      grafana_admin_password:
        description: Optional Grafana admin password override
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    with:
      server_id_override: ${{ inputs.server_id_override }}
      target_user: devops
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '15'
      mode: platform
    secrets: inherit

  deploy:
    needs: grant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_api_token: ${{ secrets.INFRA_API_TOKEN }}
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}
      - name: Download observability artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ./downloaded-artifacts
      - name: Resolve archive
        id: artifact
        run: |
          set -euo pipefail
          archive_path="$(find ./downloaded-artifacts -type f -name 'platforminit-observability-*.tar.gz' | sort | head -n1)"
          [ -n "$archive_path" ] || { find ./downloaded-artifacts -type f | sort >&2; exit 1; }
          filename="$(basename "$archive_path")"
          short_sha="${filename#platforminit-observability-}"
          short_sha="${short_sha%.tar.gz}"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
      - name: Render remote observability script
        env:
          GRAFANA_ADMIN_PASSWORD_SECRET: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD_INPUT: ${{ inputs.grafana_admin_password }}
        run: |
          set -euo pipefail
          grafana_admin_password="$GRAFANA_ADMIN_PASSWORD_SECRET"
          if [ -n "$GRAFANA_ADMIN_PASSWORD_INPUT" ]; then
            grafana_admin_password="$GRAFANA_ADMIN_PASSWORD_INPUT"
          fi
          [ -n "$grafana_admin_password" ] || grafana_admin_password='admin'
          cat > /tmp/ch05-remote.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          SHORT_SHA="$1"
          password_file="$2"
          GRAFANA_ADMIN_PASSWORD="$(cat "$password_file")"
          release_dir="/srv/platforminit/observability/${SHORT_SHA}"
          tmp_dir="/tmp/platforminit-observability/${SHORT_SHA}"
          unpack_dir="${tmp_dir}/unpacked"
          mkdir -p "$release_dir" "$unpack_dir"
          rm -rf "${release_dir:?}/"* "${unpack_dir:?}/"*
          tar -xzf "${tmp_dir}/observability-release.tar.gz" -C "$unpack_dir"
          test -d "$unpack_dir/platform/observability" || { echo "Missing platform/observability in artifact" >&2; find "$unpack_dir" -maxdepth 4 -print >&2; exit 1; }
          rsync -a --delete "$unpack_dir/platform/observability/" "$release_dir/"
          find "$release_dir" -type f -name "*.sh" -exec chmod +x {} \;
          helm repo add vm https://victoriametrics.github.io/helm-charts/ >/dev/null 2>&1 || true
          helm repo add grafana https://grafana.github.io/helm-charts >/dev/null 2>&1 || true
          helm repo update >/dev/null 2>&1
          env GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" bash "$release_dir/scripts/ch05-orchestrator.sh"
          EOS
          chmod +x /tmp/ch05-remote.sh
          printf '%s' "$grafana_admin_password" > /tmp/ch05-admin-password.txt
      - name: Upload and run observability deploy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 devops@${{ steps.server.outputs.public_ip }} "mkdir -p /tmp/platforminit-observability/${{ steps.artifact.outputs.short_sha }}"
          scp -i ~/.ssh/id_ed25519 "${{ steps.artifact.outputs.archive_path }}" devops@${{ steps.server.outputs.public_ip }}:/tmp/platforminit-observability/${{ steps.artifact.outputs.short_sha }}/observability-release.tar.gz
          scp -i ~/.ssh/id_ed25519 /tmp/ch05-remote.sh devops@${{ steps.server.outputs.public_ip }}:/tmp/ch05-remote.sh
          scp -i ~/.ssh/id_ed25519 /tmp/ch05-admin-password.txt devops@${{ steps.server.outputs.public_ip }}:/tmp/ch05-admin-password.txt
          ssh -i ~/.ssh/id_ed25519 devops@${{ steps.server.outputs.public_ip }}             "chmod +x /tmp/ch05-remote.sh && /tmp/ch05-remote.sh '${{ steps.artifact.outputs.short_sha }}' /tmp/ch05-admin-password.txt"
