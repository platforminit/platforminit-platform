name: 05 - Deploy Observability Stack

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Producing build workflow run ID
        required: true
        type: string
      artifact_id:
        description: Observability artifact ID
        required: true
        type: string
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''
      deploy_mode:
        description: Baseline or reconcile mode
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - reconcile

permissions:
  contents: read
  actions: read

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    with:
      server_id_override: ${{ inputs.server_id_override }}
      target_user: devops
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '15'
      mode: observability
    secrets: inherit

  deploy:
    needs: grant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_api_token: ${{ secrets.INFRA_API_TOKEN }}
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Download observability artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ./downloaded-artifacts

      - name: Resolve archive
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find ./downloaded-artifacts -type f -name 'platforminit-observability-*.tar.gz' | sort | head -n1)"
          [ -n "$archive_path" ] || { find ./downloaded-artifacts -type f | sort >&2; exit 1; }
          filename="$(basename "$archive_path")"
          short_sha="${filename#platforminit-observability-}"
          short_sha="${short_sha%.tar.gz}"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote observability script
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          PLATFORM_BASE_DOMAIN: ${{ secrets.PLATFORM_BASE_DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ch05-remote.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          SHORT_SHA="$1"
          DEPLOY_MODE="$2"
          PLATFORM_BASE_DOMAIN="$3"
          GRAFANA_ADMIN_PASSWORD="$4"

          [[ "${EUID}" -eq 0 ]] || { echo "ch05-remote.sh must run as root" >&2; exit 1; }

          release_dir="/srv/platforminit/observability/${SHORT_SHA}"
          tmp_dir="/tmp/platforminit-observability/${SHORT_SHA}"
          unpack_dir="${tmp_dir}/unpacked"
          report_dir="/srv/platforminit/observability/reports"
          report_file="${report_dir}/ch05-validate-${SHORT_SHA}.log"

          mkdir -p "$release_dir" "$unpack_dir" "$report_dir"
          rm -rf "${release_dir:?}/"* "${unpack_dir:?}/"*
          tar -xzf "${tmp_dir}/observability-release.tar.gz" -C "$unpack_dir"

          test -d "$unpack_dir/platform/observability" || {
            echo "Missing platform/observability in artifact" >&2
            find "$unpack_dir" -maxdepth 4 -print >&2
            exit 1
          }

          rsync -a --delete "$unpack_dir/platform/observability/" "$release_dir/"
          find "$release_dir" -type f -name "*.sh" -exec chmod +x {} \;

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          test -f "$KUBECONFIG" || { echo "Missing kubeconfig at $KUBECONFIG" >&2; exit 1; }

          env \
            KUBECONFIG="$KUBECONFIG" \
            DEPLOY_MODE="$DEPLOY_MODE" \
            BASE_DOMAIN="$PLATFORM_BASE_DOMAIN" \
            GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
            bash "$release_dir/scripts/ch05-orchestrator.sh"

          env KUBECONFIG="$KUBECONFIG" bash "$release_dir/validate/ch05-validate-observability.sh" | tee "$report_file"
          EOS
          chmod +x /tmp/ch05-remote.sh

      - name: Upload and run observability deploy
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
          ARCHIVE: ${{ steps.artifact.outputs.archive_path }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          PLATFORM_BASE_DOMAIN: ${{ secrets.PLATFORM_BASE_DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "mkdir -p /tmp/platforminit-observability/${SHORTSHA} /tmp/platforminit-run"
          scp -i ~/.ssh/id_ed25519 "$ARCHIVE" "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-observability/${SHORTSHA}/observability-release.tar.gz"
          scp -i ~/.ssh/id_ed25519 /tmp/ch05-remote.sh "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/ch05-remote.sh"
          ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" \
            "chmod +x /tmp/platforminit-run/ch05-remote.sh && sudo -n /tmp/platforminit-run/ch05-remote.sh '$SHORTSHA' '$DEPLOY_MODE' '$PLATFORM_BASE_DOMAIN' '$GRAFANA_ADMIN_PASSWORD'"

      - name: Fetch validation report
        if: always()
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./observability-reports
          if ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "test -f /srv/platforminit/observability/reports/ch05-validate-${SHORTSHA}.log"; then
            scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:/srv/platforminit/observability/reports/ch05-validate-${SHORTSHA}.log" "./observability-reports/"
          else
            echo "No validation report found; deploy failed before validation step"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch05-observability-validate-${{ steps.artifact.outputs.short_sha }}
          path: ./observability-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Print deploy metadata
        if: always()
        shell: bash
        run: |
          {
            echo "## Observability deploy metadata"
            echo ""
            echo "- Workflow run ID: \`${{ github.run_id }}\`"
            echo "- Artifact run ID: \`${{ inputs.artifact_run_id }}\`"
            echo "- Artifact ID: \`${{ inputs.artifact_id }}\`"
            echo "- Short SHA: \`${{ steps.artifact.outputs.short_sha }}\`"
            echo "- Target host: \`${{ steps.server.outputs.public_ip }}\`"
            echo "- Deploy mode: \`${{ inputs.deploy_mode }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
