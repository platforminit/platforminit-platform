name: 05.1 - Provision Dashboards

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Producing build workflow run ID
        required: true
        type: string
      artifact_id:
        description: Observability artifact ID
        required: true
        type: string
      project:
        description: PlatformInit project label / logical environment
        required: false
        default: development
      host_name:
        description: Logical host name within the project
        required: false
        default: platforminit-dev-01
      role:
        description: Target host role used for label discovery when host_name is empty
        required: false
        default: primary
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  HCLOUD_TOKEN_DEVELOPMENT: ${{ secrets.HCLOUD_TOKEN_DEVELOPMENT }}
  HCLOUD_TOKEN_N8N: ${{ secrets.HCLOUD_TOKEN_N8N }}
  HCLOUD_TOKEN_PLATFORMINIT: ${{ secrets.HCLOUD_TOKEN_PLATFORMINIT }}

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    secrets: inherit
    with:
      project: ${{ inputs.project || 'development' }}
      host_name: ${{ inputs.host_name || 'platforminit-dev-01' }}
      role: ${{ inputs.role || 'primary' }}
      server_id_override: ${{ inputs.server_id_override }}
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '10'
      mode: observability

  deploy:
    needs: grant
    runs-on: ubuntu-latest
    environment: ${{ inputs.project || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          project: ${{ inputs.project || 'development' }}
          host_name: ${{ inputs.host_name || 'platforminit-dev-01' }}
          role: ${{ inputs.role || 'primary' }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Download observability artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ./downloaded-artifacts

      - name: Resolve archive
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find ./downloaded-artifacts -type f -name 'platforminit-observability-*.tar.gz' | sort | head -n1)"
          [ -n "$archive_path" ] || { find ./downloaded-artifacts -type f | sort >&2; exit 1; }
          filename="$(basename "$archive_path")"
          short_sha="${filename#platforminit-observability-}"
          short_sha="${short_sha%.tar.gz}"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote dashboard provisioner
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ch05-remote.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          usage() {
            echo "Usage: $0 run SHORT_SHA OWNER_USER" >&2
            exit 2
          }

          [[ $# -eq 3 ]] || usage
          ACTION="$1"
          SHORT_SHA="$2"
          OWNER_USER="$3"
          [[ "$ACTION" == "run" ]] || usage
          [[ "${EUID}" -eq 0 ]] || { echo "ch05-remote.sh must run as root" >&2; exit 1; }

          if [[ -f /etc/platforminit/host-context.env ]]; then
            # shellcheck disable=SC1091
            source /etc/platforminit/host-context.env
          fi
          PLATFORMINIT_OBSERVABILITY_PATH="${PLATFORMINIT_OBSERVABILITY_PATH:-/srv/observability}"

          release_root="${PLATFORMINIT_OBSERVABILITY_PATH}/platforminit"
          release_dir="${release_root}/${SHORT_SHA}"
          tmp_root="/tmp/platforminit-observability"
          tmp_dir="${tmp_root}/${SHORT_SHA}"
          unpack_dir="${tmp_dir}/unpacked"
          report_dir="${release_root}/reports"
          run_log="${tmp_dir}/ch05-1-dashboards-run-${SHORT_SHA}.log"
          validate_log="${tmp_dir}/ch05-1-dashboards-validate-${SHORT_SHA}.log"
          report_file="${report_dir}/ch05-1-dashboards-validate-${SHORT_SHA}.log"

          ensure_owner_access() {
            mkdir -p "$tmp_dir"
            chown "${OWNER_USER}:${OWNER_USER}" "$tmp_dir" 2>/dev/null || true
            chmod 755 "$tmp_dir" 2>/dev/null || true
            for f in "$run_log" "$validate_log"; do
              if [ -e "$f" ]; then
                chown "${OWNER_USER}:${OWNER_USER}" "$f" 2>/dev/null || true
                chmod 644 "$f" 2>/dev/null || true
              fi
            done
          }

          main() {
            mkdir -p "$release_dir" "$unpack_dir" "$report_dir" "$tmp_dir"
            : > "$run_log"
            ensure_owner_access
            exec > >(tee -a "$run_log") 2>&1

            rm -rf "${release_dir:?}/"* "${unpack_dir:?}/"*
            tar -xzf "${tmp_dir}/observability-release.tar.gz" -C "$unpack_dir"

            test -d "$unpack_dir/platform/observability" || {
              echo "Missing platform/observability in artifact" >&2
              find "$unpack_dir" -maxdepth 4 -print >&2
              exit 1
            }

            rsync -a --delete "$unpack_dir/platform/observability/" "$release_dir/"
            find "$release_dir" -type f -name "*.sh" -exec chmod +x {} \;

            export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
            test -f "$KUBECONFIG" || {
              echo "Missing kubeconfig at $KUBECONFIG" >&2
              exit 1
            }

            env KUBECONFIG="$KUBECONFIG" "$release_dir/scripts/ch05-1-provision-dashboards.sh"
            env KUBECONFIG="$KUBECONFIG" "$release_dir/validate/ch05-1-validate-dashboards.sh" | tee "$validate_log"
            cp "$validate_log" "$report_file" || true
            ensure_owner_access
          }

          main "$@"
          EOS
          chmod +x /tmp/ch05-remote.sh

      - name: Upload and run dashboard provisioner
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
          ARCHIVE: ${{ steps.artifact.outputs.archive_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./observability-reports
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "mkdir -p /tmp/platforminit-observability/${SHORTSHA} /tmp/platforminit-run"
          scp -i ~/.ssh/id_ed25519 "$ARCHIVE" "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-observability/${SHORTSHA}/observability-release.tar.gz"
          scp -i ~/.ssh/id_ed25519 /tmp/ch05-remote.sh "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/ch05-remote.sh"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "
            set -euo pipefail
            chmod +x /tmp/platforminit-run/ch05-remote.sh
            sudo -n /tmp/platforminit-run/ch05-remote.sh run '${SHORTSHA}' '${HOST_LOGIN_USER}'
          "

      - name: Fetch dashboard validation report
        if: always()
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
          SHORTSHA: ${{ steps.artifact.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./observability-reports
          remote_tmp_dir="/tmp/platforminit-observability/${SHORTSHA}"

          if ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "test -f '${remote_tmp_dir}/ch05-1-dashboards-validate-${SHORTSHA}.log'"; then
            scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:${remote_tmp_dir}/ch05-1-dashboards-validate-${SHORTSHA}.log" "./observability-reports/ch05-1-dashboards-validate-${SHORTSHA}.log"
          else
            echo "No dashboard validation report found"
          fi

          if ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "test -f '${remote_tmp_dir}/ch05-1-dashboards-run-${SHORTSHA}.log'"; then
            scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:${remote_tmp_dir}/ch05-1-dashboards-run-${SHORTSHA}.log" "./observability-reports/ch05-1-dashboards-run-${SHORTSHA}.log"
          fi

      - name: Upload dashboard validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch05-1-dashboards-validate-${{ steps.artifact.outputs.short_sha }}
          path: ./observability-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Print deploy metadata
        if: always()
        shell: bash
        run: |
          {
            echo "CH05.1 dashboard provisioning finished"
            echo "artifact_run_id=${{ inputs.artifact_run_id }}"
            echo "artifact_id=${{ inputs.artifact_id }}"
            echo "short_sha=${{ steps.artifact.outputs.short_sha }}"
            echo "host_public_ip=${{ steps.server.outputs.public_ip }}"
          }
