name: 02.5.2 - Run AIDE Check

on:
  workflow_dispatch:
    inputs:
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  grant:
    uses: ./.github/workflows/a1-access-elevation.yml
    with:
      server_id_override: ${{ inputs.server_id_override }}
      host_ipv4_override: ${{ inputs.host_ipv4_override }}
      duration_minutes: '15'
      mode: aide-check
    secrets: inherit

  run:
    needs: grant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_api_token: ${{ secrets.INFRA_API_TOKEN }}
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload scripts and config
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" "mkdir -p /tmp/platforminit-run"
          scp -i ~/.ssh/id_ed25519                 platform/host-baseline/scripts/aide-check.sh                 platform/host-baseline/scripts/lib-policy.sh                 platform/host-baseline/aide/aide.conf                 "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-run/"

      - name: Execute AIDE check detached
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST" '
            rm -f /tmp/platforminit-aide-check.txt /tmp/platforminit-aide-check.exit /tmp/platforminit-aide-check.nohup
            chmod +x /tmp/platforminit-run/aide-check.sh
            nohup sudo -n /tmp/platforminit-run/aide-check.sh /tmp/platforminit-aide-check.txt                   >/tmp/platforminit-aide-check.nohup 2>&1 &
            pid=$!
            (
              wait "$pid"
              rc=$?
              echo "$rc" > /tmp/platforminit-aide-check.exit
            ) >/dev/null 2>&1 &
          '

      - name: Wait for AIDE check result
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            if ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST"                   'test -f /tmp/platforminit-aide-check.exit'; then
              echo "AIDE check completed."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for AIDE check completion." >&2
          exit 1

      - name: Fetch report
        if: always()
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          HOST_LOGIN_USER: ${{ secrets.HOST_LOGIN_USER }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/aide-check
          scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-aide-check.txt" artifacts/aide-check/ 2>/dev/null || true
          scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-aide-check.nohup" artifacts/aide-check/ 2>/dev/null || true
          scp -i ~/.ssh/id_ed25519 "$HOST_LOGIN_USER@$HOST:/tmp/platforminit-aide-check.exit" artifacts/aide-check/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aide-check-${{ github.run_id }}
          path: artifacts/aide-check
          if-no-files-found: ignore
